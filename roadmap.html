<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗺️ 필터 로드맵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 15% 10%, rgba(91,164,255,0.16), transparent 28%),
                        radial-gradient(circle at 88% 18%, rgba(255,196,111,0.12), transparent 25%),
                        linear-gradient(180deg, #0b1420 0%, #101c28 48%, #0a111a 100%);
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            padding: 16px;
            padding-bottom: 80px;
            color: #fff;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.22;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .header {
            position: relative;
            z-index: 1;
            padding: 10px 4px 22px;
        }
        .trip-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .eyebrow {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 5px;
        }
        .header h1 {
            font-size: 27px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 10%, #9fd2ff 48%, #f2c78b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .trip-subtitle {
            color: rgba(255,255,255,0.56);
            font-size: 12px;
            margin-top: 7px;
        }
        .header .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }
        .trip-progress {
            position: relative;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            background: rgba(255,255,255,0.045);
            overflow: hidden;
        }
        .trip-progress::before {
            content: "";
            position: absolute;
            left: 28px;
            right: 88px;
            top: 50%;
            height: 1px;
            background: repeating-linear-gradient(90deg, rgba(242,199,139,0.5) 0 5px, transparent 5px 10px);
        }
        .progress-stop {
            position: relative;
            z-index: 1;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #152434;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 13px;
        }
        .progress-label {
            margin-left: auto;
            font-size: 10px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        #filter-list {
            position: relative;
            z-index: 1;
        }
        .filter-card {
            position: relative;
            background: linear-gradient(145deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.09);
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 34px rgba(0,0,0,0.18);
        }
        .filter-card::after {
            content: "";
            position: absolute;
            left: 20px;
            bottom: -15px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f2c78b;
        }
        .filter-card:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 24px;
            bottom: -21px;
            width: 1px;
            height: 21px;
            border-left: 1px dashed rgba(242,199,139,0.38);
            z-index: 3;
        }
        .filter-card .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(0,0,0,0.3);
        }
        .filter-card .filter-header .name {
            font-size: 18px;
            font-weight: 600;
        }
        .filter-card .filter-header .badge {
            font-size: 12px;
            background: rgba(74,122,255,0.3);
            padding: 4px 12px;
            border-radius: 30px;
            color: #8ab4ff;
        }

        .filter-card .photo-area {
            position: relative;
            width: 100%;
            min-height: 220px;
            max-height: 520px;
            background: linear-gradient(135deg, #121f2d, #080f17);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }
        .filter-card .photo-area::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 14px;
            pointer-events: none;
        }
        .filter-card .photo-area img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            object-position: center;
            border-radius: 12px;
        }
        .filter-card .photo-area.portrait-tall { min-height: 300px; }
        .filter-card .photo-area.landscape-wide { min-height: 190px; }
        .filter-card .photo-area .placeholder {
            color: rgba(255,255,255,0.25);
            font-size: 14px;
            text-align: center;
            padding: 16px;
        }
        .filter-card .photo-area .placeholder .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .filter-card .controls {
            display: flex;
            gap: 10px;
            padding: 12px 16px 16px 16px;
            flex-wrap: wrap;
        }
        .filter-card .controls button {
            flex: 1;
            min-width: 60px;
            padding: 10px 12px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .filter-card .controls button:active {
            transform: scale(0.94);
        }
        .filter-card .controls .upload-btn {
            background: #4a7aff;
            color: #fff;
        }
        .filter-card .controls .delete-btn {
            background: rgba(255,70,70,0.2);
            color: #ff6b6b;
        }

        .filter-card .memo-area {
            padding: 0 16px 16px 16px;
        }
        .filter-card .memo-area textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ccc;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 50px;
            transition: 0.2s;
        }
        .filter-card .memo-area textarea:focus {
            outline: none;
            border-color: #4a7aff;
            background: rgba(255,255,255,0.08);
        }
        .filter-card .memo-area textarea::placeholder {
            color: rgba(255,255,255,0.25);
        }

        /* 숨김 파일 입력 */
        .hidden-input {
            display: none;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            padding: 20px 0 10px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            margin-top: 10px;
        }
        .footer-note span {
            color: rgba(255,255,255,0.35);
        }

        /* 업로드 완료 토스트 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74,122,255,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="trip-head">
            <div>
                <div class="eyebrow">MY FILTER JOURNEY</div>
                <h1>여행의 장면들</h1>
                <div class="trip-subtitle">사진 한 장씩, 나만의 여행 기록을 완성해보세요.</div>
            </div>
            <button class="back-btn" onclick="location.href='index.html'">📷 카메라</button>
        </div>
        <div class="trip-progress">
            <div class="progress-stop">🧳</div>
            <div class="progress-stop">📷</div>
            <div class="progress-stop">📮</div>
            <div class="progress-stop">🌅</div>
            <div class="progress-stop">✈️</div>
            <span class="progress-label">TRAVEL LOG</span>
        </div>
    </div>

    <div id="filter-list"></div>

    <div class="footer-note">
        <span>📸 각 필터에 가장 어울리는 사진을 업로드하세요</span><br>
        <span style="font-size:10px;">💾 자동 저장 (localStorage)</span>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toast" class="toast">✅ 업로드 완료!</div>

    <script>
        // ============================================================
        // 1. 필터 정의 (index.html과 동기화)
        // ============================================================
        const FILTERS = [
            { id: 'original', label: '✨ 원본', emoji: '🌿', desc: '자연 그대로' },
            { id: 'indigo', label: '💙 남색', emoji: '🌊', desc: '깊고 차가운' },
            { id: 'noise', label: '📺 노이즈', emoji: '📼', desc: '복고 감성' },
            { id: 'y2k', label: '🌸 Y2K', emoji: '🌈', desc: '핑크빛 레트로' },
            { id: 'sepia', label: '🟫 세피아', emoji: '📜', desc: '빈티지 감성' },
            { id: 'grayscale', label: '⚫ 흑백', emoji: '🎞️', desc: '모노크롬' },
            { id: 'invert', label: '🔄 반전', emoji: '🎬', desc: '네거티브' },
            { id: 'high_contrast', label: '🔆 고대비', emoji: '💥', desc: '강렬한 대비' },
            { id: 'warm', label: '☀️ 따뜻한', emoji: '🌅', desc: '따뜻한 분위기' },
            { id: 'cool', label: '❄️ 차가운', emoji: '🌌', desc: '시원한 느낌' },
            { id: 'pixelate', label: '🧊 픽셀화', emoji: '🎮', desc: '레트로 게임' }
        ];

        // ============================================================
        // 2. 데이터 관리 (localStorage)
        // ============================================================
        const STORAGE_KEY = 'filter_roadmap_data';

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch { return {}; }
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getFilterData(filterId) {
            const all = loadData();
            return all[filterId] || { imageDataUrl: null, memo: '' };
        }

        function setFilterData(filterId, imageDataUrl, memo) {
            const all = loadData();
            all[filterId] = { imageDataUrl, memo: memo || '' };
            saveData(all);
        }

        // ============================================================
        // 3. 토스트 메시지
        // ============================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================================
        // 4. UI 렌더링
        // ============================================================
        function renderFilters() {
            const container = document.getElementById('filter-list');
            container.innerHTML = '';

            FILTERS.forEach(filter => {
                const data = getFilterData(filter.id);
                const card = document.createElement('div');
                card.className = 'filter-card';
                card.dataset.filterId = filter.id;

                const header = document.createElement('div');
                header.className = 'filter-header';
                header.innerHTML = `
                    <span class="name">${filter.emoji} ${filter.label}</span>
                    <span class="badge">${filter.desc}</span>
                `;

                const photoArea = document.createElement('div');
                photoArea.className = 'photo-area';

                if (data.imageDataUrl) {
                    const img = document.createElement('img');
                    img.src = data.imageDataUrl;
                    img.alt = filter.label;
                    img.onload = () => {
                        const ratio = img.naturalWidth / img.naturalHeight;
                        if (ratio < 0.72) photoArea.classList.add('portrait-tall');
                        else if (ratio > 1.55) photoArea.classList.add('landscape-wide');
                    };
                    photoArea.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'placeholder';
                    placeholder.innerHTML = `
                        <span class="icon">🖼️</span>
                        아직 사진이 없어요<br>
                        <span style="font-size:12px; opacity:0.6;">업로드 버튼을 눌러주세요</span>
                    `;
                    photoArea.appendChild(placeholder);
                }

                const controls = document.createElement('div');
                controls.className = 'controls';

                const uploadBtn = document.createElement('button');
                uploadBtn.className = 'upload-btn';
                uploadBtn.textContent = '📤 업로드';
                uploadBtn.onclick = () => triggerUpload(filter.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '🗑️ 삭제';
                deleteBtn.onclick = () => deletePhoto(filter.id);

                controls.appendChild(uploadBtn);
                controls.appendChild(deleteBtn);

                const memoArea = document.createElement('div');
                memoArea.className = 'memo-area';
                const textarea = document.createElement('textarea');
                textarea.placeholder = '✏️ 여행지나 느낌을 적어보세요...';
                textarea.value = data.memo || '';
                textarea.oninput = (e) => {
                    const current = getFilterData(filter.id);
                    setFilterData(filter.id, current.imageDataUrl, e.target.value);
                };
                memoArea.appendChild(textarea);

                card.appendChild(header);
                card.appendChild(photoArea);
                card.appendChild(controls);
                card.appendChild(memoArea);
                container.appendChild(card);
            });
        }

        // ============================================================
        // 5. 업로드 (갤러리 전용 - 카메라 강제 실행 없음)
        // ============================================================
        function triggerUpload(filterId) {
            const input = document.createElement('input');
            input.type = 'file';
            // ⭐ 중요: capture 속성을 제거하여 갤러리만 열리게 함
            // ⭐ accept="image/*" 만으로 모바일에서 갤러리 + 카메라 선택창이 뜸
            //    하지만 capture 속성이 없으면 대부분 갤러리가 먼저 열림
            input.accept = 'image/*';
            input.className = 'hidden-input';

            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    const current = getFilterData(filterId);
                    setFilterData(filterId, dataUrl, current.memo || '');
                    renderFilters();
                    showToast(`✅ ${FILTERS.find(f => f.id === filterId).label} 업로드 완료!`);
                };
                reader.readAsDataURL(file);
                input.value = '';
            };

            document.body.appendChild(input);
            input.click();
            document.body.removeChild(input);
        }

        // ============================================================
        // 6. 삭제
        // ============================================================
        function deletePhoto(filterId) {
            if (!confirm(`${FILTERS.find(f => f.id === filterId).label} 사진을 삭제하시겠어요?`)) return;
            setFilterData(filterId, null, '');
            renderFilters();
            showToast(`🗑️ ${FILTERS.find(f => f.id === filterId).label} 삭제됨`);
        }

        // ============================================================
        // 7. 초기화 및 실행
        // ============================================================
        renderFilters();
        console.log('🗺️ 필터 로드맵 데이터:', loadData());
        console.log('📸 지원 필터:', FILTERS.map(f => f.label).join(', '));
    </script>
</body>
</html>
